<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Crime // Coming Soon</title>
    <style>
        :root {
            --accent-color: #A1B6E7;
            --bg-glass: rgba(20, 20, 24, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b0b0e;
            color: #fff;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0b0b0e 70%);
            overflow: hidden;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(161, 182, 231, 0.1);
            border: 1px solid rgba(161, 182, 231, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #fff;
        }

        p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 24px;
            background: var(--accent-color);
            color: #0b0b0e;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(161, 182, 231, 0.2);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(161, 182, 231, 0.3);
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <div class="badge-dot"></div>
            <span>Сайт в разработке</span>
        </div>
        <h1>True Crime Bio</h1>
        <p>Мы создаем новый невероятный лендинг и экосистему био-страниц. Скоро здесь будет что-то грандиозное.</p>
        <a href="dashboard/" class="btn">
            Перейти в дашборд
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        <div class="footer-note">True Crime Ecosystem &copy; 2026</div>
    </div>
</body>
</html>
