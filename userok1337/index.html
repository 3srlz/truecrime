<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            padding: 20px;
            position: relative;
            perspective: 1200px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(22, 22, 24, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform-style: preserve-3d;
            will-change: transform;
            transition: max-width 0.3s ease, width 0.3s ease;
        }

        .container.has-comments {
            max-width: 860px !important;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            align-items: start;
            padding: 32px;
        }

        .left-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-comments {
            width: 100%;
            margin-top: 0 !important;
        }

        @media (max-width: 768px) {
            .container.has-comments {
                max-width: 440px !important;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }

        .avatar-container {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 16px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #2a2a2a;
            flex-shrink: 0;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .verified-badge svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .quote {
            font-size: 13px;
            font-style: italic;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .bio {
            font-size: 14px;
            font-weight: 400;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 16px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .location-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            color: #C5C5C5;
            margin-bottom: 24px;
        }

        .location-container svg {
            width: 14px;
            height: 14px;
            fill: #C5C5C5;
        }

        .buttons-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transform: translateY(1.5px);
        }

        .btn-icon svg {
            width: 100%;
            height: 100%;
            fill: #C5C5C5;
        }

        .btn-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .arrow-icon {
            width: 16px;
            height: 16px;
            stroke: #C5C5C5;
            margin-left: auto;
            transform: translateY(1px);
        }

        /* Dynamic button layout rules */
        .buttons-grid[data-count="1"] .btn:nth-child(1) {
            grid-column: span 2;
        }
        .buttons-grid[data-count="3"] .btn:nth-child(3) {
            grid-column: span 2;
        }

        .music-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 12px;
        }

        .music-container iframe {
            width: 100% !important;
            height: 140px !important;
            border: none !important;
            display: block;
            border-radius: 16px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

                <a href="#" class="btn hidden" id="discord-server-btn" target="_blank">

            <!-- Clock Widget -->

                <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px;">

        <!-- Right Comments Column (Transparent Background) -->
        <div class="right-comments music-container hidden" id="comments-block" style="padding: 14px 16px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 13px; font-weight: 600; color: #fff;" id="comments-title">Комментарии 0</span>
                <span style="font-size: 11px; color: rgba(255, 255, 255, 0.5);" id="comments-rating">0 оценок</span>

            <!-- Comments List -->

            <!-- Add Comment Form -->

                <input type="text" id="comment-author" placeholder="Ваше имя или анонимно..." style="width: 100%; padding: 8px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 12px;">
                <textarea id="comment-text" placeholder="Написать комментарий..." style="width: 100%; padding: 8px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 12px; resize: none; height: 50px;"></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="comment-cooldown" style="font-size: 11px; color: #ff5c5c;"></span>
                    <button onclick="postComment()" style="padding: 6px 14px; background: var(--accent-color, #A1B6E7); color: #0b0b0e; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Отправить</button>

    <script>
        const card = document.querySelector('.container');
        const CURRENT_USER_PAGE = 'userok1337';

        document.addEventListener('mousemove', (e)=>{
            const x = (window.innerWidth / 2 - e.clientX) / 45;
            const y = (window.innerHeight / 2 - e.clientY) / 45;

            card.style.transform = `
                perspective(1200px)
                rotateY(${-x}deg)
                rotateX(${y}deg)
            `;
        });

        async function fetchDiscordServerName(inviteUrl) {
            try {
                const match = inviteUrl.match(/(?:discord\.(?:gg|com\/invite)\/)([a-zA-Z0-9-]+)/);
                if (!match) return 'Discord Server';
                const code = match[1];
                const res = await fetch(`https://discord.com/api/v9/invites/${code}?with_expiration=true`);
                if (!res.ok) return 'Discord Server';
                const data = await res.json();
                if (data && data.guild && data.guild.name) {
                    return data.guild.name;
                }
            } catch (e) {}
            return 'Discord Server';
        }

        function typeWriter(element, text, speed = 35) {
            element.textContent = '';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function initClock(offsetStr, label) {
            const clockBlock = document.getElementById('clock-block');
            if (clockBlock) {
                clockBlock.classList.remove('hidden');
            }

            function tick() {
                const now = new Date();
                const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
                const offsetHours = parseFloat(offsetStr) || 0;
                const targetTime = new Date(utcTime + (3600000 * offsetHours));

                const hours = String(targetTime.getHours()).padStart(2, '0');
                const minutes = String(targetTime.getMinutes()).padStart(2, '0');
                const seconds = String(targetTime.getSeconds()).padStart(2, '0');

                document.getElementById('clock-hms').textContent = `${hours}:${minutes}`;
                document.getElementById('clock-sec').textContent = `:${seconds}`;

                const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
                const day = targetTime.getDate();
                const month = months[targetTime.getMonth()];
                document.getElementById('clock-date').textContent = `${day} ${month}`;

                const sign = offsetHours >= 0 ? `+${offsetHours}` : `${offsetHours}`;
                document.getElementById('clock-label').textContent = `${label || 'Время'} GMT${sign}`;
            }
            tick();
            setInterval(tick, 1000);
        }

        async function loadComments() {
            const container = document.getElementById('main-container');
            const commentsBlock = document.getElementById('comments-block');
            if (commentsBlock && container) {
                container.classList.add('has-comments');
                commentsBlock.classList.remove('hidden');
            }
            try {
                const res = await fetch(`https://fireguild-cb569-default-rtdb.firebaseio.com/${CURRENT_USER_PAGE}/comments.json`);
                const commentsObj = await res.json() || {};
                const listEl = document.getElementById('comments-list');
                listEl.innerHTML = '';

                const keys = Object.keys(commentsObj);
                document.getElementById('comments-title').textContent = `Комментарии ${keys.length}`;
                document.getElementById('comments-rating').textContent = `${keys.length} оценка`;

                if (keys.length === 0) {
                    listEl.innerHTML = '<div style="font-size: 12px; color: rgba(255,255,255,0.4); text-align: center; padding: 6px;">Пока нет комментариев</div>';
                    return;
                }

                keys.forEach(key => {
                    const c = commentsObj[key];
                    const item = document.createElement('div');
                    item.style.cssText = 'display: flex; gap: 8px; align-items: flex-start; background: rgba(255,255,255,0.02); padding: 8px 10px; border-radius: 8px;';
                    item.innerHTML = `
                        <div style="width: 26px; height: 26px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; color: #fff; flex-shrink: 0;">${c.author ? c.author.charAt(0).toUpperCase() : '?'}</div>
                        <div style="flex-grow: 1; overflow: hidden;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                                <span style="font-size: 12px; font-weight: 600; color: #fff;">${c.author || 'Аноним'}</span>
                                <span style="font-size: 10px; color: rgba(255,255,255,0.4);">${c.date || ''}</span>
                            </div>
                            <div style="font-size: 12px; color: rgba(255,255,255,0.8); word-break: break-word;">${c.text || ''}</div>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            } catch(e) {
                console.error(e);
            }
        }

        async function postComment() {
            const author = document.getElementById('comment-author').value.trim();
            const text = document.getElementById('comment-text').value.trim();
            const cooldownEl = document.getElementById('comment-cooldown');
            cooldownEl.textContent = '';

            if (!author || !text) {
                cooldownEl.textContent = 'Заполните имя и текст';
                return;
            }

            // 15 hours cooldown = 15 * 60 * 60 * 1000 = 54000000 ms
            const lastTime = localStorage.getItem(`last_comment_${CURRENT_USER_PAGE}`);
            const now = Date.now();
            const CD_TIME = 15 * 60 * 60 * 1000;

            if (lastTime && (now - lastTime < CD_TIME)) {
                const leftMs = CD_TIME - (now - lastTime);
                const leftHrs = Math.ceil(leftMs / (1000 * 60 * 60));
                cooldownEl.textContent = `КД 15ч! Осталось ${leftHrs} ч.`;
                return;
            }

            const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const d = new Date();
            const dateStr = `${d.getDate()} ${months[d.getMonth()]}`;

            const newComment = { author, text, date: dateStr };

            try {
                const res = await fetch(`https://fireguild-cb569-default-rtdb.firebaseio.com/${CURRENT_USER_PAGE}/comments.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newComment)
                });
                if (res.ok) {
                    localStorage.setItem(`last_comment_${CURRENT_USER_PAGE}`, now);
                    document.getElementById('comment-author').value = '';
                    document.getElementById('comment-text').value = '';
                    cooldownEl.style.color = '#5cff9e';
                    cooldownEl.textContent = 'Успешно!';
                    loadComments();
                }
            } catch(e) {
                cooldownEl.textContent = 'Ошибка';
            }
        }

        async function loadData() {
            try {
                const response = await fetch('https://fireguild-cb569-default-rtdb.firebaseio.com/userok1337.json');
                const data = await response.json();

                if (!data) return;

                function isValid(val) {
                    return val && val !== "null" && val !== "undefined" && String(val).trim() !== "";
                }

                // Banner
                if (isValid(data.banner)) {
                    document.body.style.backgroundImage = `url('${data.banner}')`;
                }

                // Avatar
                const avatarBlock = document.getElementById('avatar-block');
                const avatarImg = document.getElementById('avatar-img');
                if (isValid(data.avatar)) {
                    avatarImg.src = data.avatar;
                } else {
                    avatarBlock.classList.add('hidden');
                }

                // Username & Page Title
                const usernameBlock = document.getElementById('username-block');
                const verifiedBadge = document.getElementById('verified-badge');
                const nameVal = isValid(data.nickname) ? data.nickname : (isValid(data.discordname) ? data.discordname : null);
                if (nameVal) {
                    usernameBlock.textContent = nameVal;
                    document.title = nameVal;
                } else {
                    usernameBlock.classList.add('hidden');
                    document.title = "Bio";
                }

                // Verified badge check
                if (data.check === true || data.check === "true") {
                    verifiedBadge.classList.remove('hidden');
                } else {
                    verifiedBadge.classList.add('hidden');
                }

                // Quote with typewriter effect
                const quoteBlock = document.getElementById('quote-block');
                if (isValid(data.qoute)) {
                    typeWriter(quoteBlock, data.qoute, 30);
                    quoteBlock.classList.remove('hidden');
                } else {
                    quoteBlock.classList.add('hidden');
                }

                // Bio with typewriter effect
                const bioBlock = document.getElementById('bio-block');
                if (isValid(data.bio)) {
                    typeWriter(bioBlock, data.bio, 35);
                } else {
                    bioBlock.classList.add('hidden');
                }

                // Location
                const locationBlock = document.getElementById('location-block');
                const locationText = document.getElementById('location-text');
                if (isValid(data.location)) {
                    locationText.textContent = data.location;
                    locationBlock.classList.remove('hidden');
                } else {
                    locationBlock.classList.add('hidden');
                }

                // Buttons visibility & dynamic count
                const buttonsGrid = document.getElementById('buttons-grid');
                const discordUserBtn = document.getElementById('discord-user-btn');
                const discordUserText = document.getElementById('discord-user-text');
                const tgUserBtn = document.getElementById('tg-user-btn');
                const tgUserText = document.getElementById('tg-user-text');
                const discordServerBtn = document.getElementById('discord-server-btn');
                const discordServerName = document.getElementById('discord-server-name');

                let activeButtonsCount = 0;

                if (isValid(data.discordname)) {
                    discordUserText.textContent = `@${data.discordname.replace(/^@/, '')}`;
                    discordUserBtn.href = `https://discord.com/users/${data.discordname}`;
                    discordUserBtn.classList.remove('hidden');
                    activeButtonsCount++;
                } else {
                    discordUserBtn.classList.add('hidden');
                }

                if (isValid(data.tgname)) {
                    const cleanTg = data.tgname.replace(/^@/, '');
                    tgUserText.textContent = `@${cleanTg}`;
                    tgUserBtn.href = `https://t.me/${cleanTg}`;
                    tgUserBtn.classList.remove('hidden');
                    activeButtonsCount++;
                } else {
                    tgUserBtn.classList.add('hidden');
                }

                if (data.disinv) {
                    discordServerBtn.href = data.disinv;
                    discordServerBtn.classList.min ? discordServerBtn.classList.remove('hidden') : null;
                    discordServerBtn.classList.remove('hidden');
                    activeButtonsCount++;
                    fetchDiscordServerName(data.disinv).then(serverName => {
                        discordServerName.textContent = serverName;
                    });
                } else {
                    discordServerBtn.classList.add('hidden');
                }

                if (activeButtonsCount > 0) {
                    buttonsGrid.classList.remove('hidden');
                    buttonsGrid.setAttribute('data-count', activeButtonsCount);
                } else {
                    buttonsGrid.classList.add('hidden');
                }

                // Clock Widget (Dynamic from DB)
                if (data.clock_enabled === true || data.clock_enabled === "true") {
                    const tzOffset = isValid(data.timezone_offset) ? data.timezone_offset : '+5';
                    const tzLabel = isValid(data.timezone_label) ? data.timezone_label : 'Екатеринбург';
                    initClock(tzOffset, tzLabel);
                } else {
                    document.getElementById('clock-block').classList.add('hidden');
                }

                // Music Widget
                const musicBlock = document.getElementById('music-block');
                const musicWrapper = document.getElementById('music-wrapper');
                if (isValid(data.music)) {
                    musicWrapper.innerHTML = data.music;
                    const iframe = musicWrapper.querySelector('iframe');
                    if (iframe) {
                        iframe.style.width = '100%';
                        iframe.style.height = '140px';
                        iframe.style.borderRadius = '16px';
                        iframe.setAttribute('width', '100%');
                        iframe.setAttribute('height', '140px');
                    }
                    musicBlock.classList.remove('hidden');
                } else {
                    musicBlock.classList.add('hidden');
                }

                // Custom HTML Widget
                const customHtmlBlock = document.getElementById('custom-html-block');
                const customHtmlWrapper = document.getElementById('custom-html-wrapper');
                if (isValid(data.custom_html)) {
                    customHtmlWrapper.innerHTML = data.custom_html;
                    customHtmlBlock.classList.remove('hidden');
                } else {
                    customHtmlBlock.classList.add('hidden');
                }

                // Comments Section (Dynamic from DB)
                const containerEl = document.getElementById('main-container');
                const commentsBlockEl = document.getElementById('comments-block');
                if (data.comments_enabled === true || data.comments_enabled === "true") {
                    loadComments();
                } else {
                    if (commentsBlockEl) commentsBlockEl.classList.add('hidden');
                    if (containerEl) containerEl.classList.remove('has-comments');
                }

            } catch (err) {
                console.error('Error loading data from Firebase:', err);
            }
        }

        loadData();
    </script>
</body>
</html>
